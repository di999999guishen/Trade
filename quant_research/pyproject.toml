[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "us-etf-quant-research"
version = "0.1.0"
description = "Isolated, reproducible ETF research with explicit readiness gates"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.10,<3", "numpy>=2,<3", "pandas>=2.2,<3",
  "pyarrow>=18", "duckdb>=1.2", "exchange-calendars>=4.6,<5",
  "yfinance>=0.2.65", "pyqlib==0.9.7", "tzdata>=2025.1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11"]

[project.scripts]
quant-research = "quant_research.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quant_research = ["defaults.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py312"
